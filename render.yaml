services:
  - type: web
    name: tds-ga3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GA3_DATA_DIR
        value: /tmp
      - key: LLM_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: LLM_MODEL
        value: gpt-4.1-nano
      - key: LLM_API_KEY
        sync: false
